name: Update pricing snapshot

# Weekly, off the hour to avoid the top-of-hour scheduling rush. The script is
# byte-stable, so a week with no upstream price changes produces no diff and this
# workflow exits without opening a pull request.
on:
  schedule:
    - name: Weekly pricing refresh
      cron: '17 6 * * 1'
  workflow_dispatch:

# Never cancel a refresh part-way: a cancelled run can leave a half-written
# snapshot branch behind.
concurrency:
  group: update-pricing
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh src/pricing/snapshot.json
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh pricing snapshot
        run: npm run update:pricing

      - name: Verify snapshot is well-formed
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const snapshot = JSON.parse(readFileSync('src/pricing/snapshot.json', 'utf8'));
            if (snapshot.schemaVersion !== 1) throw new Error('unexpected schemaVersion: ' + snapshot.schemaVersion);
            if (typeof snapshot.updatedAt !== 'string') throw new Error('updatedAt must be a string');
            if (typeof snapshot.models !== 'object' || snapshot.models === null) throw new Error('models must be an object');
            const models = Object.entries(snapshot.models);
            if (models.length === 0) throw new Error('models is empty');
            for (const [id, pricing] of models) {
              for (const side of ['input', 'output']) {
                const value = pricing[side];
                if (typeof value !== 'number' || !Number.isFinite(value) || value < 0) {
                  throw new Error('bad ' + side + ' price for ' + id + ': ' + value);
                }
              }
            }
            console.log(models.length + ' models, updatedAt ' + snapshot.updatedAt);
          "

      - name: Detect pricing changes
        id: changes
        run: |
          if git diff --quiet -- src/pricing/snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pricing changes upstream. Snapshot left untouched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Pricing changes"
              echo ""
              git --no-pager diff --stat -- src/pricing/snapshot.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A refreshed snapshot is still a code change, so it has to pass the same
      # gate as any other pull request before a human is asked to review it.
      - name: Verify build still passes
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-pricing
          base: main
          commit-message: 'chore(pricing): refresh pricing snapshot'
          title: 'chore(pricing): refresh pricing snapshot'
          body: |
            Automated weekly refresh of `src/pricing/snapshot.json` from the
            [LiteLLM pricing feed](https://github.com/BerriAI/litellm). No
            pricing logic changed: `src/pricing/normalize.ts` is untouched.

            - [ ] Review newly added models
            - [ ] Review removed or deprecated models
            - [ ] Spot-check a few prices against vendor pricing pages
          add-paths: src/pricing/snapshot.json
          delete-branch: true
