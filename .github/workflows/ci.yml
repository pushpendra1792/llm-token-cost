name: CI

# Every pull request, plus pushes to main. Pushes to a branch that already has
# an open pull request are covered by the `pull_request` run, so triggering on
# those too would only duplicate the same commit for no extra signal.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Brackets the declared engines floor (>=20) and current LTS. The
      # package has no native dependencies, so more versions would cost CI
      # minutes without catching anything these two do not.
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  package:
    name: Verify published tarball contents
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fail if sources or tests leak into the tarball
        run: |
          npm pack --dry-run --json > pack.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const [tarball] = JSON.parse(readFileSync('pack.json', 'utf8'));
            // .d.ts files are build output that package.json points 'types' at,
            // so only hand-written .ts sources count as a leak.
            const leaked = tarball.files
              .map((file) => file.path)
              .filter((path) => /^(src|test)\//.test(path) || (path.endsWith('.ts') && !path.endsWith('.d.ts')));
            if (leaked.length > 0) {
              console.error('::error::would publish source or test files: ' + leaked.join(', '));
              process.exit(1);
            }
            const kib = (tarball.unpackedSize / 1024).toFixed(0);
            console.log(tarball.files.length + ' files, ' + kib + ' KiB unpacked');
          "
