# Auth: npm trusted publishing via OIDC (id-token: write). There is deliberately
# no NPM_TOKEN secret: once this workflow is registered as a trusted publisher on
# npm, the token is minted per-run and expires with the job. The first release is
# the exception and is published by hand, because a package has to exist on npm
# before it can be registered as a trusted publisher. See README "Releasing".
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.0)'
        required: true

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # No registry-url here on purpose: setting it makes setup-node write a
      # project .npmrc holding an unresolved ${NODE_AUTH_TOKEN} placeholder,
      # which can stop npm from reaching the OIDC exchange. npm already defaults
      # to registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm trusted publishing requires npm >= 11.5.1, but the Node 22 toolchain
      # on the runner ships npm 10.x. Upgraded once here so the whole job runs on
      # a single npm version instead of mixing 10.x through install and build.
      # Pinned to the 11.x line rather than @latest so a future npm major cannot
      # change install or publish behaviour without a commit here.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11
          NPM_VERSION="$(npm --version)"
          if [ "$(printf '%s\n' '11.5.1' "$NPM_VERSION" | sort -V | head -n 1)" != '11.5.1' ]; then
            echo "::error::npm $NPM_VERSION is too old. npm trusted publishing (OIDC) requires npm >= 11.5.1."
            exit 1
          fi
          echo "npm $NPM_VERSION satisfies the >= 11.5.1 requirement for trusted publishing."

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Typecheck, test and build
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Check version is not already published
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version > /dev/null 2>&1; then
            echo "::error::$PKG_NAME@$PKG_VERSION is already on npm"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish
    # Creating a Release is a contents write, which the publish job does not need.
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
